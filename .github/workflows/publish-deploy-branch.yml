name: Publish Static Deploy Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calculator-static-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Run analytics contract
        run: npm run test:e2e -- tests/analytics.spec.ts

      - name: Write deployment manifest
        run: |
          set -Eeuo pipefail
          printf '%s\n' "${GITHUB_SHA}" > dist/SOURCE_COMMIT
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/BUILD_TIME_UTC
          touch dist/.nojekyll
          (
            cd dist
            find . -type f \
              ! -name SHA256SUMS \
              -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS
          )

      - name: Publish deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd dist
          git init
          git checkout -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish calculator ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:deploy
